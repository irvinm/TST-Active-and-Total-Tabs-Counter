<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tab Counter Options</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="popup-header">
        <img src="images/icon.png" alt="" class="popup-header-icon">
        <h1 class="popup-header-title">TST Active and Total Tabs Counter</h1>
    </header>

    <nav class="tab-nav">
        <button type="button" class="tab-button active" data-tab="tab-window-names">Window Names</button>
        <button type="button" class="tab-button" data-tab="tab-sidebar-display">Sidebar Display</button>
        <button type="button" class="tab-button" data-tab="tab-badge-counter">Badge Counter</button>
    </nav>

    <!-- Tab 1: Window Names -->
    <div id="tab-window-names" class="tab-content active">
        <div id="window-list">
            <!-- Open windows and editable names will be dynamically populated here -->
        </div>
    </div>

    <!-- Tab 2: Sidebar Display -->
    <div id="tab-sidebar-display" class="tab-content">
        <div id="sidebar-preview">
            <!-- Text representation of windows dynamically rendered here -->
        </div>
        <div id="display-options-list">
            <label class="option-card" for="oneLinePerWindow">
                <input type="radio" id="oneLinePerWindow" name="displayStyleOption" value="oneLinePerWindow">
                <div class="option-text">
                    <span class="option-title">1 Line Per Window</span>
                    <span class="option-desc">Table-aligned monospace layout with one row per window and global totals</span>
                </div>
            </label>
            <label class="option-card" for="compactView">
                <input type="radio" id="compactView" name="displayStyleOption" value="compactView">
                <div class="option-text">
                    <span class="option-title">Compact View</span>
                    <span class="option-desc">Inline narrow-font layout joining all window tab counts in a continuous string</span>
                </div>
            </label>
        </div>
    </div>

    <!-- Tab 3: Badge Counter -->
    <div id="tab-badge-counter" class="tab-content">
        <div id="badge-preview">
            <!-- Badge preview progression dynamically rendered here -->
        </div>
        <div id="badge-options-list">
            <label class="option-card" for="switchToSVG">
                <input type="radio" id="switchToSVG" name="displayOption" value="switchToSVG">
                <div class="option-text">
                    <span class="option-title">Native Badge (1–999) + SVG (1000+)</span>
                    <span class="option-desc">Native badge text up to 999 tabs, then switches to dynamic SVG for 1000+ tabs</span>
                </div>
            </label>
            <label class="option-card" for="alwaysSVG">
                <input type="radio" id="alwaysSVG" name="displayOption" value="alwaysSVG">
                <div class="option-text">
                    <span class="option-title">Always Dynamic SVG</span>
                    <span class="option-desc">Renders tab counts directly onto the icon using dynamic SVG for all tab counts</span>
                </div>
            </label>
        </div>
    </div>

    <div id="message"></div>
    <script src="popup.js"></script>
</body>
</html>
